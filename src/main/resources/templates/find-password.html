<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobMate - 비밀번호 찾기</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --navy:#0f2340; --navy2:#0a1a2e; --accent:#3b82f6; --border:#dce8f0; }
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Pretendard','Noto Sans KR',sans-serif;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:linear-gradient(135deg,var(--navy2) 0%, #1a2e4a 100%);
            padding:24px;
        }
        .card{
            width:100%;
            max-width:520px;
            background:#fff;
            border-radius:20px;
            padding:40px 34px;
            box-shadow:0 20px 60px rgba(0,0,0,.25);
        }
        .logo{
            text-align:center;
            font-size:1.55rem;
            font-weight:900;
            letter-spacing:6px;
            color:var(--navy);
            margin-bottom:6px;
        }
        .sub{
            text-align:center;
            font-size:12px;
            color:#94a3b8;
            margin-bottom:28px;
            letter-spacing:2px;
        }
        h2{
            font-size:22px;
            font-weight:800;
            color:var(--navy);
            margin-bottom:10px;
            text-align:center;
        }
        .desc{
            font-size:13px;
            color:#64748b;
            text-align:center;
            line-height:1.7;
            margin-bottom:24px;
        }
        .form-group{margin-bottom:14px;}
        .form-group label{
            display:block;
            font-size:12.5px;
            font-weight:700;
            color:#2a3f56;
            margin-bottom:6px;
        }
        .form-group input{
            width:100%;
            padding:12px 14px;
            border:1.5px solid var(--border);
            border-radius:10px;
            font-size:14px;
            background:#f8fafc;
            outline:none;
            transition:.2s;
        }
        .form-group input:focus{
            border-color:var(--accent);
            background:#fff;
            box-shadow:0 0 0 3px rgba(59,130,246,.1);
        }
        .input-row{
            display:flex;
            gap:8px;
        }
        .input-row input{flex:1;}
        .btn-send{
            padding:12px 16px;
            background:var(--navy);
            color:#fff;
            border:none;
            border-radius:10px;
            font-size:13px;
            font-weight:700;
            cursor:pointer;
            white-space:nowrap;
        }
        .btn-send:hover{background:#162d4a;}
        .btn-send:disabled{background:#94a3b8;cursor:not-allowed;}
        .btn-main{
            width:100%;
            padding:13px;
            background:var(--navy);
            color:#fff;
            border:none;
            border-radius:10px;
            font-size:15px;
            font-weight:700;
            cursor:pointer;
            margin-top:6px;
        }
        .btn-main:hover{background:#162d4a;}
        .btn-main:disabled{background:#94a3b8;cursor:not-allowed;}
        .btn-sub{
            width:100%;
            padding:12px;
            background:transparent;
            color:#4a6480;
            border:1.5px solid var(--border);
            border-radius:10px;
            font-size:13.5px;
            font-weight:600;
            cursor:pointer;
            margin-top:8px;
        }
        .btn-sub:hover{background:#f8fafc;}
        .msg{
            margin-top:14px;
            padding:12px 14px;
            border-radius:10px;
            display:none;
            font-size:13px;
            font-weight:600;
            line-height:1.6;
        }
        .msg.ok{display:block;background:#dcfce7;color:#166534;}
        .msg.err{display:block;background:#fee2e2;color:#b91c1c;}
        .hint{
            font-size:11px;
            color:#94a3b8;
            margin-top:6px;
        }
        .panel{display:none;}
        .panel.active{display:block;}
        .pw-match{
            min-height:16px;
            font-size:12px;
            font-weight:600;
            margin-top:6px;
        }
        .pw-match.ok{color:#16a34a;}
        .pw-match.err{color:#dc2626;}
        .steps{
            display:flex;
            align-items:center;
            justify-content:center;
            margin-bottom:26px;
        }
        .step{
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:4px;
            flex:1;
        }
        .step-circle{
            width:32px;
            height:32px;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:13px;
            font-weight:700;
            border:2px solid #dce8f0;
            color:#94a3b8;
            background:#f8fafc;
        }
        .step-circle.active{background:var(--navy);border-color:var(--navy);color:#fff;}
        .step-circle.done{background:#16a34a;border-color:#16a34a;color:#fff;}
        .step-label{
            font-size:10px;
            color:#94a3b8;
            font-weight:700;
            white-space:nowrap;
        }
        .step-label.active{color:var(--navy);}
        .step-line{
            height:2px;
            flex:1;
            background:#dce8f0;
            margin-bottom:16px;
        }
        .step-line.done{background:#16a34a;}
    </style>
</head>
<body>
<div class="card">
    <div class="logo">JOBMATE</div>
    <div class="sub">비밀번호 찾기</div>

    <div class="steps">
        <div class="step">
            <div class="step-circle active" id="sc1">1</div>
            <div class="step-label active" id="sl1">이메일 인증</div>
        </div>
        <div class="step-line" id="line1"></div>
        <div class="step">
            <div class="step-circle" id="sc2">2</div>
            <div class="step-label" id="sl2">새 비밀번호</div>
        </div>
        <div class="step-line" id="line2"></div>
        <div class="step">
            <div class="step-circle" id="sc3">3</div>
            <div class="step-label" id="sl3">완료</div>
        </div>
    </div>

    <div class="panel active" id="panel1">
        <h2>비밀번호 재설정</h2>
        <p class="desc">가입한 이메일로 인증코드를 받은 뒤<br>새 비밀번호를 설정해주세요.</p>

        <div class="form-group">
            <label>이메일 주소</label>
            <div class="input-row">
                <input type="email" id="email" placeholder="example@email.com">
                <button class="btn-send" id="sendBtn" onclick="sendCode()">인증코드 발송</button>
            </div>
        </div>

        <div class="form-group" id="codeWrap" style="display:none;">
            <label>인증 코드</label>
            <div class="input-row">
                <input type="text" id="code" placeholder="000000" maxlength="6" inputmode="numeric">
                <button class="btn-send" onclick="verifyCode()">확인</button>
            </div>
            <div class="hint">인증 코드는 5분 동안 유효합니다.</div>
        </div>

        <div class="msg" id="msg1"></div>
        <button class="btn-main" id="nextBtn" onclick="goStep2()" disabled>다음</button>
        <button class="btn-sub" onclick="location.href='/'">로그인으로 돌아가기</button>
    </div>

    <div class="panel" id="panel2">
        <h2>새 비밀번호 설정</h2>
        <p class="desc">인증이 완료되었습니다.<br>새 비밀번호를 입력해주세요.</p>

        <div class="form-group">
            <label>새 비밀번호</label>
            <input type="password" id="newPassword" placeholder="8자 이상 입력" oninput="checkPwMatch()">
        </div>

        <div class="form-group">
            <label>새 비밀번호 확인</label>
            <input type="password" id="newPassword2" placeholder="비밀번호 다시 입력" oninput="checkPwMatch()">
            <div class="pw-match" id="pwMatch"></div>
        </div>

        <div class="msg" id="msg2"></div>
        <button class="btn-main" onclick="resetPassword()">비밀번호 변경</button>
        <button class="btn-sub" onclick="location.href='/'">로그인으로 돌아가기</button>
    </div>

    <div class="panel" id="panel3" style="text-align:center;">
        <h2>변경 완료</h2>
        <p class="desc">비밀번호가 정상적으로 변경되었습니다.<br>새 비밀번호로 로그인하세요.</p>
        <button class="btn-main" onclick="location.href='/'">로그인하러 가기</button>
    </div>
</div>

<script>
    let verifiedEmail = '';
    let countdown = null;

    async function sendCode() {
        const email = document.getElementById('email').value.trim();
        const btn = document.getElementById('sendBtn');
        const msg = document.getElementById('msg1');

        msg.className = 'msg';
        msg.textContent = '';

        if (!email || !email.includes('@')) {
            msg.textContent = '올바른 이메일을 입력해주세요.';
            msg.className = 'msg err';
            return;
        }

        btn.disabled = true;
        btn.textContent = '발송 중...';

        try {
            const res = await fetch('/api/members/verify/send', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email, checkExist: 'true' })
            });

            const data = await res.json();

            if (data.success) {
                msg.textContent = '인증코드를 발송했습니다. 메일을 확인해주세요.';
                msg.className = 'msg ok';
                document.getElementById('codeWrap').style.display = 'block';
                document.getElementById('email').readOnly = true;
                startCountdown(btn);
            } else {
                msg.textContent = data.message || '인증코드 발송에 실패했습니다.';
                msg.className = 'msg err';
                btn.disabled = false;
                btn.textContent = '인증코드 발송';
            }
        } catch (e) {
            msg.textContent = '서버 연결에 실패했습니다.';
            msg.className = 'msg err';
            btn.disabled = false;
            btn.textContent = '인증코드 발송';
        }
    }

    function startCountdown(btn) {
        let sec = 300;
        clearInterval(countdown);

        btn.disabled = true;
        btn.textContent = `재발송 (${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')})`;

        countdown = setInterval(() => {
            sec--;
            btn.textContent = `재발송 (${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')})`;

            if (sec <= 0) {
                clearInterval(countdown);
                btn.disabled = false;
                btn.textContent = '인증코드 재발송';
            }
        }, 1000);
    }

    async function verifyCode() {
        const email = document.getElementById('email').value.trim();
        const code = document.getElementById('code').value.trim();
        const msg = document.getElementById('msg1');

        msg.className = 'msg';
        msg.textContent = '';

        if (code.length !== 6) {
            msg.textContent = '6자리 코드를 입력해주세요.';
            msg.className = 'msg err';
            return;
        }

        try {
            const res = await fetch('/api/members/verify/check', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email, code })
            });

            const data = await res.json();

            if (data.success) {
                verifiedEmail = email;
                msg.textContent = '인증이 완료되었습니다.';
                msg.className = 'msg ok';
                document.getElementById('code').readOnly = true;
                document.getElementById('nextBtn').disabled = false;
                clearInterval(countdown);
            } else {
                msg.textContent = data.message || '인증에 실패했습니다.';
                msg.className = 'msg err';
            }
        } catch (e) {
            msg.textContent = '서버 연결에 실패했습니다.';
            msg.className = 'msg err';
        }
    }

    function goStep2() {
        if (!verifiedEmail) return;
        setStep(2);
    }

    function checkPwMatch() {
        const pw = document.getElementById('newPassword').value;
        const pw2 = document.getElementById('newPassword2').value;
        const el = document.getElementById('pwMatch');

        if (!pw2) {
            el.textContent = '';
            el.className = 'pw-match';
            return;
        }

        if (pw === pw2) {
            el.textContent = '✅ 비밀번호가 일치합니다';
            el.className = 'pw-match ok';
        } else {
            el.textContent = '❌ 비밀번호가 일치하지 않습니다';
            el.className = 'pw-match err';
        }
    }

    async function resetPassword() {
        const newPassword = document.getElementById('newPassword').value;
        const newPassword2 = document.getElementById('newPassword2').value;
        const msg = document.getElementById('msg2');

        msg.className = 'msg';
        msg.textContent = '';

        if (!verifiedEmail) {
            msg.textContent = '이메일 인증을 먼저 완료해주세요.';
            msg.className = 'msg err';
            return;
        }

        if (newPassword.length < 8) {
            msg.textContent = '새 비밀번호는 8자 이상이어야 합니다.';
            msg.className = 'msg err';
            return;
        }

        if (newPassword !== newPassword2) {
            msg.textContent = '비밀번호가 일치하지 않습니다.';
            msg.className = 'msg err';
            return;
        }

        try {
            const res = await fetch('/api/members/reset-password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: verifiedEmail, newPassword })
            });

            const data = await res.json();

            if (data.success) {
                setStep(3);
            } else {
                msg.textContent = data.message || '비밀번호 변경에 실패했습니다.';
                msg.className = 'msg err';
            }
        } catch (e) {
            msg.textContent = '서버 연결에 실패했습니다.';
            msg.className = 'msg err';
        }
    }

    function setStep(n) {
        [1,2,3].forEach(i => {
            document.getElementById('panel' + i).classList.toggle('active', i === n);

            const sc = document.getElementById('sc' + i);
            const sl = document.getElementById('sl' + i);

            if (i < n) {
                sc.classList.add('done');
                sc.classList.remove('active');
                sc.textContent = '✓';
                sl.classList.remove('active');
            } else if (i === n) {
                sc.classList.add('active');
                sc.classList.remove('done');
                sc.textContent = i;
                sl.classList.add('active');
            } else {
                sc.classList.remove('active', 'done');
                sc.textContent = i;
                sl.classList.remove('active');
            }
        });

        [1,2].forEach(i => {
            const line = document.getElementById('line' + i);
            if (i < n) line.classList.add('done');
            else line.classList.remove('done');
        });
    }
</script>
</body>
</html>
