<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobMate - 글쓰기</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --navy:#1e3a5f; --navy2:#162d4a; --accent:#3b82f6; --bg:#f0f4f8; --border:#d6e0ec; --text:#1a2a3a; --text-sub:#6b7f96; --radius:14px; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Pretendard','Noto Sans KR',sans-serif; background:var(--bg); min-height:100vh; overflow-x:hidden; }

        header { background:linear-gradient(135deg,var(--navy2) 0%,var(--navy) 100%); padding:0 40px; height:64px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:200; box-shadow:0 2px 20px rgba(30,58,95,0.3); }
        header::after { content:''; position:absolute; bottom:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--accent),transparent); }
        .logo { color:white; font-size:1.3rem; font-weight:900; letter-spacing:4px; cursor:pointer; text-decoration:none; }
        .header-right { display:flex; align-items:center; gap:10px; }
        .btn-back { background:rgba(255,255,255,0.15); color:white; border:1px solid rgba(255,255,255,0.3); padding:7px 16px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; transition:background .2s; text-decoration:none; }
        .btn-back:hover { background:rgba(255,255,255,0.25); }
        .hamburger { width:40px; height:40px; border-radius:10px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; transition:background .2s; }
        .hamburger:hover { background:rgba(255,255,255,0.2); }
        .hamburger span { display:block; width:18px; height:2px; background:white; border-radius:2px; transition:all .3s; }
        .hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
        .hamburger.open span:nth-child(2){opacity:0;transform:scaleX(0);}
        .hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}

        .drawer-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:300; opacity:0; visibility:hidden; transition:all .3s; }
        .drawer-overlay.open { opacity:1; visibility:visible; }
        .drawer { position:fixed; top:0; right:-320px; width:300px; height:100vh; background:white; z-index:400; display:flex; flex-direction:column; transition:right .35s cubic-bezier(0.34,1.56,0.64,1); box-shadow:-8px 0 40px rgba(0,0,0,0.15); }
        .drawer.open { right:0; }
        .drawer-header { background:linear-gradient(135deg,var(--navy2),var(--navy)); padding:24px 24px 20px; position:relative; flex-shrink:0; }
        .drawer-header::after { content:''; position:absolute; bottom:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--accent),transparent); }
        .drawer-logo { color:white; font-size:1.1rem; font-weight:900; letter-spacing:4px; margin-bottom:16px; }
        .drawer-user { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.1); border-radius:10px; padding:10px 14px; }
        .drawer-avatar { width:38px; height:38px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; color:white; flex-shrink:0; }
        .drawer-user-name { color:white; font-size:14px; font-weight:700; }
        .drawer-user-sub { color:rgba(255,255,255,0.6); font-size:11px; margin-top:2px; }
        .drawer-close { position:absolute; top:16px; right:16px; width:30px; height:30px; border-radius:8px; background:rgba(255,255,255,0.15); border:none; color:white; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
        .drawer-close:hover { background:rgba(255,255,255,0.3); }
        .drawer-nav { flex:1; padding:12px; overflow-y:auto; }
        .drawer-section-label { font-size:10px; font-weight:700; color:var(--text-sub); letter-spacing:2px; text-transform:uppercase; padding:10px 12px 6px; }
        .drawer-item { display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:12px; font-size:14px; font-weight:600; color:var(--text); cursor:pointer; text-decoration:none; transition:all .2s; margin-bottom:2px; }
        .drawer-item:hover { background:#f0f4f8; color:var(--navy); }
        .drawer-item.active { background:#eef4ff; color:var(--navy); }
        .item-icon { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
        .item-icon.blue{background:#dbeafe} .item-icon.green{background:#dcfce7} .item-icon.yellow{background:#fef3c7}
        .item-icon.purple{background:#f3e8ff} .item-icon.pink{background:#fce7f3} .item-icon.indigo{background:#e0e7ff}
        .item-icon.orange{background:#fff7ed} .item-icon.note{background:#f5f3ff}
        .item-text{flex:1} .item-desc{font-size:11px;color:var(--text-sub);font-weight:400;margin-top:1px;}
        .drawer-divider { height:1px; background:var(--border); margin:8px 12px; }
        .drawer-footer { padding:16px 12px; border-top:1px solid var(--border); flex-shrink:0; }
        .btn-logout-drawer { width:100%; padding:12px; border-radius:12px; background:#fee2e2; color:#dc2626; border:1.5px solid #fecaca; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:8px; }
        .btn-logout-drawer:hover { background:#fecaca; }

        .container { max-width:760px; margin:0 auto; padding:32px 16px; }
        .page-title { font-size:22px; font-weight:800; color:var(--navy); margin-bottom:24px; }
        .card { background:white; border-radius:16px; border:1.5px solid var(--border); padding:28px; }
        .form-group { margin-bottom:20px; }
        .form-group label { display:block; font-size:13px; font-weight:700; color:var(--navy); margin-bottom:8px; }
        .form-group input, .form-group select, .form-group textarea { width:100%; padding:12px 16px; border:1.5px solid var(--border); border-radius:10px; font-size:14px; font-family:inherit; color:var(--text); outline:none; transition:border-color .2s; background:#f8fafc; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--accent); background:white; }
        .form-group textarea { resize:vertical; min-height:280px; line-height:1.7; }
        .anonymous-check { display:flex; align-items:center; gap:8px; margin-bottom:20px; cursor:pointer; }
        .anonymous-check input { width:auto; }
        .anonymous-check span { font-size:14px; color:var(--text-sub); }
        .btn-row { display:flex; gap:10px; justify-content:flex-end; margin-top:8px; }
        .btn-cancel { padding:12px 24px; border-radius:10px; border:1.5px solid var(--border); background:white; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
        .btn-cancel:hover { border-color:var(--navy); }
        .btn-submit { padding:12px 28px; border-radius:10px; background:var(--accent); color:white; border:none; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; transition:all .2s; }
        .btn-submit:hover { background:#2563eb; transform:translateY(-1px); }
        .tag-hint { font-size:12px; color:var(--text-sub); margin-top:6px; }

        @media(max-width:640px){ header{padding:0 16px} .container{padding:20px 12px} .card{padding:20px} .btn-row{flex-direction:column} .btn-row button{width:100%;} }
    </style>
</head>
<body>

<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
    <div class="drawer-header">
        <button class="drawer-close" onclick="closeDrawer()">✕</button>
        <div class="drawer-logo">JOBMATE</div>
        <div class="drawer-user">
            <div class="drawer-avatar" id="drawerAvatar">?</div>
            <div><div class="drawer-user-name" id="drawerUserName">불러오는 중...</div><div class="drawer-user-sub">로그인됨</div></div>
        </div>
    </div>
    <nav class="drawer-nav">
        <div class="drawer-section-label">메인 메뉴</div>
        <a class="drawer-item" href="/dashboard"><div class="item-icon blue"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></div><div class="item-text"><div>대시보드</div><div class="item-desc">홈 화면으로 이동</div></div></a>
        <a class="drawer-item" href="/jobs"><div class="item-icon green"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></div><div class="item-text"><div>공고 매칭</div><div class="item-desc">맞춤 채용공고 확인</div></div></a>
        <a class="drawer-item active" href="/community"><div class="item-icon indigo"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div><div class="item-text"><div>커뮤니티</div><div class="item-desc">개발자들과 소통하기</div></div></a>
        <a class="drawer-item" href="/interview"><div class="item-icon yellow"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#b45309" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><div class="item-text"><div>면접 코칭</div><div class="item-desc">AI 면접 질문 & 피드백</div></div></a>
        <a class="drawer-item" href="/interview-notes"><div class="item-icon note"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></div><div class="item-text"><div>면접 오답노트</div><div class="item-desc">면접 질문·피드백 복습</div></div></a>
        <a class="drawer-item" href="/profile-setup"><div class="item-icon purple"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg></div><div class="item-text"><div>맞춤 정보 설정</div><div class="item-desc">직무·기술스택·지역·연봉 설정</div></div></a>
        <div class="drawer-divider"></div>
        <div class="drawer-section-label">설정</div>
        <a class="drawer-item" href="/account"><div class="item-icon orange"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ea580c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><div class="item-text"><div>계정 관리</div><div class="item-desc">비밀번호·개인정보 변경</div></div></a>
    </nav>
    <div class="drawer-footer"><button class="btn-logout-drawer" onclick="logout()">🚪 로그아웃</button></div>
</div>

<header>
    <a class="logo" href="/dashboard">JOBMATE</a>
    <div class="header-right">
        <a class="btn-back" href="/community">← 커뮤니티로</a>
        <div class="hamburger" id="hamburger" onclick="toggleDrawer()"><span></span><span></span><span></span></div>
    </div>
</header>

<div class="container">
    <div class="page-title">✏️ 글쓰기</div>
    <div class="card">
        <div class="form-group">
            <label>카테고리 *</label>
            <select id="category">
                <option value="FREE">💬 자유게시판</option>
                <option value="REVIEW">🎉 취업후기/합격수기</option>
                <option value="INTERVIEW">📝 면접질문 공유</option>
                <option value="STUDY">📚 스터디 모집</option>
            </select>
        </div>
        <div class="form-group">
            <label>제목 *</label>
            <input type="text" id="title" placeholder="제목을 입력하세요" maxlength="100">
        </div>
        <div class="form-group">
            <label>내용 *</label>
            <textarea id="content" placeholder="내용을 입력하세요"></textarea>
        </div>
        <div class="form-group">
            <label>태그</label>
            <input type="text" id="tags" placeholder="예: Spring, 백엔드, 카카오">
            <div class="tag-hint">쉼표(,)로 구분해서 입력하세요</div>
        </div>
        <label class="anonymous-check">
            <input type="checkbox" id="anonymous">
            <span>익명으로 작성하기</span>
        </label>
        <div class="btn-row">
            <button class="btn-cancel" onclick="location.href='/community'">취소</button>
            <button class="btn-submit" onclick="submitPost()">게시하기</button>
        </div>
    </div>
</div>

<script>
    (async () => {
        try {
            const res = await fetch('/api/members/me');
            if (!res.ok) return;
            const data = await res.json();
            const name = data.name || data.email || '사용자';
            document.getElementById('drawerUserName').textContent = name + '님';
            document.getElementById('drawerAvatar').textContent = name.charAt(0);
        } catch {}
    })();

    async function submitPost() {
        const title = document.getElementById('title').value.trim();
        const content = document.getElementById('content').value.trim();
        const category = document.getElementById('category').value;
        const tags = document.getElementById('tags').value.trim();
        const anonymous = document.getElementById('anonymous').checked;
        if (!title) { alert('제목을 입력해주세요.'); return; }
        if (!content) { alert('내용을 입력해주세요.'); return; }
        const res = await fetch('/api/posts', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ title, content, category, tags, anonymous })
        });
        if (res.status === 401) { alert('로그인이 필요합니다.'); location.href='/'; return; }
        if (res.ok) { const data = await res.json(); location.href = '/community/' + data.id; }
        else alert('게시글 작성에 실패했습니다.');
    }

    function toggleDrawer() { document.getElementById('drawer').classList.contains('open') ? closeDrawer() : openDrawer(); }
    function openDrawer() { document.getElementById('drawer').classList.add('open'); document.getElementById('drawerOverlay').classList.add('open'); document.getElementById('hamburger').classList.add('open'); document.body.style.overflow='hidden'; }
    function closeDrawer() { document.getElementById('drawer').classList.remove('open'); document.getElementById('drawerOverlay').classList.remove('open'); document.getElementById('hamburger').classList.remove('open'); document.body.style.overflow=''; }
    document.addEventListener('keydown', e => { if(e.key==='Escape') closeDrawer(); });
    async function logout() { await fetch('/api/members/logout',{method:'POST'}); location.href='/'; }
</script>
</body>
</html>
