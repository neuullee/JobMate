<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobMate - 아이디 찾기</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --navy:#0f2340; --navy2:#0a1a2e; --accent:#3b82f6; --border:#dce8f0; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Pretendard','Noto Sans KR',sans-serif;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:linear-gradient(135deg,var(--navy2) 0%, #1a2e4a 100%);
            padding:24px;
        }
        .card {
            width:100%;
            max-width:480px;
            background:#fff;
            border-radius:20px;
            padding:40px 34px;
            box-shadow:0 20px 60px rgba(0,0,0,.25);
        }
        .logo {
            text-align:center;
            font-size:1.55rem;
            font-weight:900;
            letter-spacing:6px;
            color:var(--navy);
            margin-bottom:6px;
        }
        .sub {
            text-align:center;
            font-size:12px;
            color:#94a3b8;
            margin-bottom:28px;
            letter-spacing:2px;
        }
        h2 {
            font-size:22px;
            font-weight:800;
            color:var(--navy);
            margin-bottom:10px;
            text-align:center;
        }
        .desc {
            font-size:13px;
            color:#64748b;
            text-align:center;
            line-height:1.7;
            margin-bottom:24px;
        }
        .form-group { margin-bottom:14px; }
        .form-group label {
            display:block;
            font-size:12.5px;
            font-weight:700;
            color:#2a3f56;
            margin-bottom:6px;
        }
        .form-group input {
            width:100%;
            padding:12px 14px;
            border:1.5px solid var(--border);
            border-radius:10px;
            font-size:14px;
            background:#f8fafc;
            outline:none;
            transition:.2s;
        }
        .form-group input:focus {
            border-color:var(--accent);
            background:#fff;
            box-shadow:0 0 0 3px rgba(59,130,246,.1);
        }
        .hint {
            font-size:11px;
            color:#94a3b8;
            margin-top:6px;
            line-height:1.5;
        }
        .btn-main {
            width:100%;
            padding:13px;
            background:var(--navy);
            color:#fff;
            border:none;
            border-radius:10px;
            font-size:15px;
            font-weight:700;
            cursor:pointer;
            margin-top:6px;
        }
        .btn-main:hover { background:#162d4a; }
        .btn-sub {
            width:100%;
            padding:12px;
            background:transparent;
            color:#4a6480;
            border:1.5px solid var(--border);
            border-radius:10px;
            font-size:13.5px;
            font-weight:600;
            cursor:pointer;
            margin-top:8px;
        }
        .btn-sub:hover { background:#f8fafc; }
        .msg {
            margin-top:14px;
            padding:12px 14px;
            border-radius:10px;
            display:none;
            font-size:13px;
            font-weight:600;
            line-height:1.6;
        }
        .msg.ok { display:block; background:#dcfce7; color:#166534; }
        .msg.err { display:block; background:#fee2e2; color:#b91c1c; }
        .result-box {
            margin-top:16px;
            padding:16px;
            border-radius:12px;
            background:#eff6ff;
            border:1px solid #bfdbfe;
            display:none;
        }
        .result-box.show { display:block; }
        .result-title {
            font-size:12px;
            font-weight:700;
            color:#1d4ed8;
            margin-bottom:8px;
        }
        .result-email {
            font-size:18px;
            font-weight:800;
            color:#0f172a;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">JOBMATE</div>
    <div class="sub">아이디 찾기</div>

    <h2>아이디(이메일) 찾기</h2>
    <p class="desc">
        가입할 때 입력한 정보로<br>
        아이디를 확인할 수 있습니다.
    </p>

    <div class="form-group">
        <label>이름</label>
        <input type="text" id="name" placeholder="이름 입력">
    </div>

    <div class="form-group">
        <label>전화번호</label>
        <input type="tel" id="phone" placeholder="010-0000-0000">
        <div class="hint">전화번호 또는 생년월일을 입력해주세요.</div>
    </div>

    <div class="form-group">
        <label>생년월일</label>
        <input type="date" id="birthDate">
    </div>

    <button class="btn-main" onclick="findId()">아이디 찾기</button>
    <button class="btn-sub" onclick="location.href='/'">로그인으로 돌아가기</button>

    <div class="msg" id="msg"></div>

    <div class="result-box" id="resultBox">
        <div class="result-title">조회된 아이디</div>
        <div class="result-email" id="resultEmail"></div>
    </div>
</div>

<script>
    async function findId() {
        const name = document.getElementById('name').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const birthDate = document.getElementById('birthDate').value;
        const msg = document.getElementById('msg');
        const resultBox = document.getElementById('resultBox');
        const resultEmail = document.getElementById('resultEmail');

        msg.className = 'msg';
        msg.textContent = '';
        resultBox.className = 'result-box';
        resultEmail.textContent = '';

        if (!name) {
            msg.textContent = '이름을 입력해주세요.';
            msg.className = 'msg err';
            return;
        }

        if (!phone && !birthDate) {
            msg.textContent = '전화번호 또는 생년월일을 입력해주세요.';
            msg.className = 'msg err';
            return;
        }

        try {
            const res = await fetch('/api/members/find-id', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, phone, birthDate })
            });

            const data = await res.json();

            if (data.success) {
                resultEmail.textContent = data.email;
                resultBox.className = 'result-box show';
                msg.textContent = '일치하는 계정을 찾았습니다.';
                msg.className = 'msg ok';
            } else {
                msg.textContent = data.message || '일치하는 계정을 찾을 수 없습니다.';
                msg.className = 'msg err';
            }
        } catch (e) {
            msg.textContent = '서버 연결에 실패했습니다.';
            msg.className = 'msg err';
        }
    }
</script>
</body>
</html>
