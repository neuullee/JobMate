<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobMate - 공고 상세</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #1e3a5f; --navy2: #162d4a; --navy-light: #2a4f80;
            --accent: #3b82f6;
            --bg: #f0f4f8; --surface: #ffffff;
            --border: #d6e0ec; --text: #1a2a3a; --text-sub: #6b7f96;
            --green: #16a34a; --yellow: #b45309; --red: #dc2626;
            --radius: 14px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

        header { background: linear-gradient(135deg, var(--navy2) 0%, var(--navy) 100%); padding: 0 40px; height: 64px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 200; box-shadow: 0 2px 20px rgba(30,58,95,0.3); }
        header::after { content:''; position:absolute; bottom:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--accent),transparent); }
        .logo { color: white; font-size: 1.3rem; font-weight: 800; letter-spacing: 4px; text-decoration: none; }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .btn-back { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); padding: 7px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: background .2s; text-decoration: none; }
        .btn-back:hover { background: rgba(255,255,255,0.25); }
        .hamburger { width:40px; height:40px; border-radius:10px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; transition:background .2s; }
        .hamburger:hover { background:rgba(255,255,255,0.2); }
        .hamburger span { display:block; width:18px; height:2px; background:white; border-radius:2px; transition:all .3s; }
        .hamburger.open span:nth-child(1) { transform:translateY(7px) rotate(45deg); }
        .hamburger.open span:nth-child(2) { opacity:0; transform:scaleX(0); }
        .hamburger.open span:nth-child(3) { transform:translateY(-7px) rotate(-45deg); }

        .drawer-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:300; opacity:0; visibility:hidden; transition:all .3s; }
        .drawer-overlay.open { opacity:1; visibility:visible; }
        .drawer { position:fixed; top:0; right:-320px; width:300px; height:100vh; background:white; z-index:400; display:flex; flex-direction:column; transition:right .35s cubic-bezier(0.34,1.56,0.64,1); box-shadow:-8px 0 40px rgba(0,0,0,0.15); }
        .drawer.open { right:0; }
        .drawer-header { background:linear-gradient(135deg,var(--navy2),var(--navy)); padding:24px 24px 20px; position:relative; flex-shrink:0; }
        .drawer-header::after { content:''; position:absolute; bottom:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--accent),transparent); }
        .drawer-logo { color:white; font-size:1.1rem; font-weight:900; letter-spacing:4px; margin-bottom:16px; }
        .drawer-user { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.1); border-radius:10px; padding:10px 14px; }
        .drawer-avatar { width:38px; height:38px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; color:white; flex-shrink:0; }
        .drawer-user-name { color:white; font-size:14px; font-weight:700; }
        .drawer-user-sub { color:rgba(255,255,255,0.6); font-size:11px; margin-top:2px; }
        .drawer-close { position:absolute; top:16px; right:16px; width:30px; height:30px; border-radius:8px; background:rgba(255,255,255,0.15); border:none; color:white; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
        .drawer-close:hover { background:rgba(255,255,255,0.3); }
        .drawer-nav { flex:1; padding:12px; overflow-y:auto; }
        .drawer-section-label { font-size:10px; font-weight:700; color:var(--text-sub); letter-spacing:2px; text-transform:uppercase; padding:10px 12px 6px; }
        .drawer-item { display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:12px; font-size:14px; font-weight:600; color:var(--text); cursor:pointer; text-decoration:none; transition:all .2s; margin-bottom:2px; }
        .drawer-item:hover { background:#f0f4f8; color:var(--navy); }
        .drawer-item.active { background:#eef4ff; color:var(--navy); }
        .item-icon { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
        .item-icon.blue{background:#dbeafe} .item-icon.green{background:#dcfce7} .item-icon.yellow{background:#fef3c7}
        .item-icon.purple{background:#f3e8ff} .item-icon.pink{background:#fce7f3} .item-icon.indigo{background:#e0e7ff}
        .item-text{flex:1} .item-desc{font-size:11px;color:var(--text-sub);font-weight:400;margin-top:1px;}
        .drawer-divider { height:1px; background:var(--border); margin:8px 12px; }
        .drawer-footer { padding:16px 12px; border-top:1px solid var(--border); flex-shrink:0; }
        .btn-logout-drawer { width:100%; padding:12px; border-radius:12px; background:#fee2e2; color:#dc2626; border:1.5px solid #fecaca; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; transition:all .2s; display:flex; align-items:center; justify-content:center; gap:8px; }
        .btn-logout-drawer:hover { background:#fecaca; }

        main { max-width: 800px; margin: 0 auto; padding: 40px 24px 80px; }
        .job-header { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 32px; margin-bottom: 20px; }
        .job-header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
        .job-company { font-size: 13px; color: var(--text-sub); font-weight: 500; margin-bottom: 8px; }
        .job-title { font-size: 22px; font-weight: 800; color: var(--text); line-height: 1.4; }
        .score-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 16px; border-radius: 100px; font-size: 13px; font-weight: 700; white-space: nowrap; }
        .score-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
        .score-badge.high { background: #dcfce7; color: var(--green); border: 1px solid #bbf7d0; }
        .score-badge.mid  { background: #fef3c7; color: var(--yellow); border: 1px solid #fde68a; }
        .score-badge.low  { background: #fee2e2; color: var(--red); border: 1px solid #fecaca; }
        .job-meta { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        .meta-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-sub); background: var(--bg); padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border); }
        .meta-item strong { color: var(--text); font-weight: 600; }
        .section-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 16px; }
        .section-title { font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .match-chart-wrap { display: flex; align-items: center; gap: 28px; margin-bottom: 18px; }
        .donut-wrap { position: relative; width: 120px; height: 120px; flex-shrink: 0; }
        .donut-wrap canvas { position: absolute; top: 0; left: 0; }
        .donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
        .donut-score { font-size: 26px; font-weight: 900; color: var(--navy); line-height: 1; }
        .donut-label { font-size: 11px; color: var(--text-sub); margin-top: 2px; }
        .chart-legend { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .legend-item { display: flex; align-items: center; gap: 10px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .legend-info { flex: 1; }
        .legend-name { font-size: 12px; font-weight: 600; color: var(--text); }
        .legend-bar { height: 5px; background: var(--border); border-radius: 100px; margin-top: 3px; overflow: hidden; }
        .legend-bar-fill { height: 100%; border-radius: 100px; transition: width 1s ease; }
        .legend-val { font-size: 12px; font-weight: 700; color: var(--navy); min-width: 36px; text-align: right; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat-box { background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; padding: 14px 16px; text-align: center; }
        .stat-box .stat-label { font-size: 12px; color: var(--text-sub); margin-bottom: 6px; }
        .stat-box .stat-value { font-size: 22px; font-weight: 900; color: var(--navy); }
        .stat-box.warn .stat-value { color: var(--red); }
        .nps-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .nps-box { background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; padding: 14px 16px; }
        .nps-box .nps-label { font-size: 11px; color: var(--text-sub); margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .nps-box .nps-value { font-size: 14px; font-weight: 700; color: var(--text); }
        .nps-loading { text-align: center; padding: 20px; color: var(--text-sub); font-size: 13px; }
        .nps-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 100px; font-size: 12px; font-weight: 700; margin-bottom: 12px; }
        .nps-badge.active { background: #dcfce7; color: var(--green); border: 1px solid #bbf7d0; }
        .nps-badge.inactive { background: #fee2e2; color: var(--red); border: 1px solid #fecaca; }
        .nps-badge.unknown { background: #f1f5f9; color: var(--text-sub); border: 1px solid var(--border); }
        .warning-box { padding: 12px 16px; background: #fff7ed; border-radius: 10px; border-left: 3px solid #f59e0b; color: #9a6700; font-size: 13px; line-height: 1.7; margin-top: 12px; }
        .info-box { padding: 12px 16px; background: #f0f9ff; border-radius: 10px; border-left: 3px solid #38bdf8; color: #0369a1; font-size: 12px; line-height: 1.7; margin-top: 8px; }
        .tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag { padding: 5px 12px; border-radius: 8px; background: #e8f0fb; border: 1px solid #b8d0f0; font-size: 12px; color: var(--navy); font-weight: 600; }
        .tag.gray { background: var(--bg); border-color: var(--border); color: var(--text-sub); }
        .full-desc { font-size: 13px; color: var(--text-sub); line-height: 1.9; white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow-y: auto; }
        .btn-toggle { background: none; border: none; color: var(--navy); font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; padding: 0; margin-top: 10px; }
        .btn-saramin { display: block; width: 100%; padding: 15px; background: white; color: var(--navy); border: 2px solid var(--navy); border-radius: var(--radius); font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; text-align: center; text-decoration: none; transition: all .2s; }
        .btn-saramin:hover { background: var(--navy); color: white; }
        #not-found { text-align: center; padding: 80px 0; color: var(--text-sub); }
        #map { width: 100%; height: 300px; border-radius: 10px; border: 1.5px solid var(--border); margin-bottom: 16px; }
        .location-input-wrap { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .location-input-wrap input { flex: 1; min-width: 160px; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 13px; font-family: inherit; outline: none; transition: border .2s; }
        .location-input-wrap input:focus { border-color: var(--navy); }
        .btn-locate { padding: 10px 16px; background: var(--navy); color: white; border: none; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; }
        .btn-locate:hover { background: var(--navy-light); }
        .btn-gps { padding: 10px 14px; background: #e8f0fb; color: var(--navy); border: 1.5px solid #b8d0f0; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; }
        .route-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .route-tab { flex: 1; padding: 10px; border: 1.5px solid var(--border); background: var(--bg); border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; text-align: center; transition: all .2s; color: var(--text-sub); }
        .route-tab.active { background: var(--navy); color: white; border-color: var(--navy); }
        .route-result { background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; padding: 16px; text-align: center; }
        .route-time { font-size: 28px; font-weight: 900; color: var(--navy); }
        .route-detail { font-size: 13px; color: var(--text-sub); margin-top: 4px; }
        .map-addr-label { font-size: 13px; color: var(--text-sub); margin-bottom: 10px; }
        .map-addr-label strong { color: var(--text); }
        .ai-summary-box { padding: 14px 16px; background: linear-gradient(135deg, #eef4ff, #f8faff); border: 1.5px solid #c7d9f8; border-radius: 10px; font-size: 13px; color: var(--navy); line-height: 1.9; }
        .ai-summary-loading { text-align: center; padding: 16px; font-size: 13px; color: var(--text-sub); }
        .similar-card { display: flex; align-items: flex-start; gap: 12px; padding: 14px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; cursor: pointer; transition: all .2s; margin-bottom: 8px; }
        .similar-card:last-child { margin-bottom: 0; }
        .similar-card:hover { background: white; border-color: var(--navy); transform: translateX(3px); box-shadow: 0 4px 12px rgba(30,58,95,0.08); }
        .sim-info { flex: 1; min-width: 0; }
        .sim-company { font-size: 11px; color: var(--text-sub); font-weight: 600; margin-bottom: 3px; }
        .sim-title { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.4; margin-bottom: 4px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .sim-meta { font-size: 11px; color: var(--text-sub); display: flex; gap: 8px; }
        .sim-arrow { font-size: 16px; color: var(--text-sub); flex-shrink: 0; margin-top: 2px; transition: transform .2s; }
        .similar-card:hover .sim-arrow { transform: translateX(3px); color: var(--navy); }
        .culture-tag { padding: 6px 14px; border-radius: 100px; background: linear-gradient(135deg, #f0fdf4, #dcfce7); border: 1px solid #86efac; font-size: 12px; color: #15803d; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; }
        .culture-tag::before { content: '✦'; font-size: 10px; }
        .value-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .value-card { background: linear-gradient(135deg, #eef4ff, #f8faff); border: 1.5px solid #c7d9f8; border-radius: 12px; padding: 14px 12px; text-align: center; }
        .value-card .value-icon { font-size: 22px; margin-bottom: 6px; }
        .value-card .value-label { font-size: 12px; font-weight: 700; color: var(--navy); line-height: 1.3; }
        .nps-trend-wrap { position: relative; height: 200px; margin-top: 8px; }
        .nps-trend-summary { display: flex; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
        .nps-trend-stat { background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 16px; flex: 1; min-width: 90px; text-align: center; }
        .nps-trend-stat .t-label { font-size: 11px; color: var(--text-sub); margin-bottom: 4px; font-weight: 600; }
        .nps-trend-stat .t-value { font-size: 18px; font-weight: 900; color: var(--navy); }
        .nps-trend-stat .t-value.up { color: var(--green); }
        .nps-trend-stat .t-value.down { color: var(--red); }
        .nps-trend-stat .t-sub { font-size: 10px; color: var(--text-sub); margin-top: 2px; }

        @media(max-width:640px){
            header{padding:0 16px} main{padding:24px 16px 60px}
            .job-header-top{flex-direction:column} .stat-grid{grid-template-columns:1fr}
            .nps-grid{grid-template-columns:1fr} .match-chart-wrap{flex-direction:column;align-items:flex-start}
            .value-grid{grid-template-columns:1fr 1fr}
        }
    </style>
</head>
<body>

<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
    <div class="drawer-header">
        <button class="drawer-close" onclick="closeDrawer()">✕</button>
        <div class="drawer-logo">JOBMATE</div>
        <div class="drawer-user">
            <div class="drawer-avatar" id="drawerAvatar">?</div>
            <div>
                <div class="drawer-user-name" id="drawerUserName">불러오는 중...</div>
                <div class="drawer-user-sub">로그인됨</div>
            </div>
        </div>
    </div>
    <nav class="drawer-nav">
        <div class="drawer-section-label">메인 메뉴</div>
        <a class="drawer-item" href="/dashboard"><div class="item-icon blue"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></div><div class="item-text"><div>대시보드</div><div class="item-desc">홈 화면으로 이동</div></div></a>
        <a class="drawer-item active" href="/jobs"><div class="item-icon green"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="1.8"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg></div><div class="item-text"><div>공고 매칭</div><div class="item-desc">맞춤 채용공고 확인</div></div></a>
        <a class="drawer-item" href="/community"><div class="item-icon indigo"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div><div class="item-text"><div>커뮤니티</div><div class="item-desc">개발자들과 소통하기</div></div></a>
        <a class="drawer-item" href="/interview"><div class="item-icon yellow"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#b45309" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><div class="item-text"><div>면접 코칭</div><div class="item-desc">AI 면접 질문 & 피드백</div></div></a>
        <a class="drawer-item" href="/interview-notes"><div class="item-icon" style="background:#f5f3ff"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></div><div class="item-text"><div>면접 오답노트</div><div class="item-desc">면접 질문·피드백 복습</div></div></a>
        <a class="drawer-item" href="/cover-letter"><div class="item-icon" style="background:#f0fdfa"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0891b2" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></div><div class="item-text"><div>이력서·자소서 관리</div><div class="item-desc">AI 피드백</div></div></a>
        <a class="drawer-item" href="/profile-setup"><div class="item-icon purple"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></div><div class="item-text"><div>맞춤 정보 설정</div><div class="item-desc">직무·기술스택·지역·연봉 설정</div></div></a>
        <div class="drawer-divider"></div>
        <div class="drawer-section-label">설정</div>
        <a class="drawer-item" href="/account"><div class="item-icon" style="background:#fff7ed"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ea580c" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><div class="item-text"><div>계정 관리</div><div class="item-desc">비밀번호·개인정보 변경</div></div></a>
    </nav>
    <div class="drawer-footer">
        <button class="btn-logout-drawer" onclick="logout()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            로그아웃
        </button>
    </div>
</div>

<header>
    <a class="logo" href="/dashboard">JOBMATE</a>
    <div class="header-right">
        <a class="btn-back" href="/jobs">← 목록으로</a>
        <div class="hamburger" id="hamburger" onclick="toggleDrawer()">
            <span></span><span></span><span></span>
        </div>
    </div>
</header>

<main id="mainContent">
    <div id="not-found" style="display:none">
        <p>공고 정보를 찾을 수 없습니다.</p>
        <a href="/jobs" style="color:var(--navy);font-weight:700;">목록으로 돌아가기</a>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<script>
    // ── 전역 상태 ──
    var kakaoMap = null, companyLatLng = null, myLatLng = null, currentRouteMode = 'transit';
    var _currentJob = null;
    var _npsChartInstance = null;

    function toggleDrawer() { document.getElementById('drawer').classList.contains('open') ? closeDrawer() : openDrawer(); }
    function openDrawer() { document.getElementById('drawer').classList.add('open'); document.getElementById('drawerOverlay').classList.add('open'); document.getElementById('hamburger').classList.add('open'); document.body.style.overflow='hidden'; }
    function closeDrawer() { document.getElementById('drawer').classList.remove('open'); document.getElementById('drawerOverlay').classList.remove('open'); document.getElementById('hamburger').classList.remove('open'); document.body.style.overflow=''; }
    document.addEventListener('keydown', e => { if (e.key==='Escape') closeDrawer(); });
    async function logout() { await fetch('/api/members/logout',{method:'POST'}); location.href='/'; }

    (async () => {
        try {
            const res = await fetch('/api/members/me');
            if (!res.ok) return;
            const data = await res.json();
            const name = data.name || data.email || '사용자';
            document.getElementById('drawerUserName').textContent = name + '님';
            document.getElementById('drawerAvatar').textContent = name.charAt(0);
        } catch {}
    })();

    function drawDonut(canvasId, score) {
        var canvas = document.getElementById(canvasId);
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        var size = 120, cx = 60, cy = 60, r = 48, lineW = 12;
        canvas.width = size; canvas.height = size;
        var color = score >= 70 ? '#16a34a' : score >= 40 ? '#b45309' : '#dc2626';
        var angle = (score / 100) * Math.PI * 2;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
        ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = lineW; ctx.stroke();
        ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI/2, -Math.PI/2 + angle);
        ctx.strokeStyle = color; ctx.lineWidth = lineW;
        ctx.lineCap = 'round'; ctx.stroke();
    }

    function formatSalary(job) {
        if (job.salaryMin && job.salaryMin > 0) {
            if (job.salaryMax && job.salaryMax > 0 && job.salaryMax !== job.salaryMin) {
                return job.salaryMin.toLocaleString() + '~' + job.salaryMax.toLocaleString() + '만원';
            }
            return job.salaryMin.toLocaleString() + '만원';
        }
        var s = String(job.salary || '').trim();
        if (!s || /^\d+$/.test(s)) return '협의';
        return s;
    }

    function parseMatchReasons(reasonStr) {
        var result = [];
        var colors = ['#3b82f6','#16a34a','#f59e0b','#8b5cf6'];
        var parts = (reasonStr || '').split('|').map(s => s.trim()).filter(Boolean);
        parts.forEach(function(part, i) {
            var m = part.match(/(.+?)\((\d+)%,(\d+),(\d+)\)/);
            if (m) {
                result.push({ name: m[1].trim(), weight: parseInt(m[2]), rawScore: parseInt(m[3]), val: parseInt(m[4]), color: colors[i % colors.length] });
            } else {
                result.push({ name: part, weight: 0, rawScore: 0, val: 0, color: colors[i % colors.length] });
            }
        });
        return result;
    }

    // ── AI 공고 요약 ──
    async function loadAiSummary(jobId) {
        if (!jobId) return;
        var el = document.getElementById('aiSummaryContent');
        if (!el) return;
        try {
            var res = await fetch('/api/jobs/' + jobId + '/summary');
            if (!res.ok) { el.innerHTML = ''; return; }
            var data = await res.json();
            if (data.summary && data.summary.trim()) {
                var cleaned = data.summary.replace(/\*\*([^*]+)\*\*/g, '$1').replace(/\*([^*]+)\*/g, '$1').replace(/#{1,6}\s/g, '').trim();
                el.innerHTML = '<div class="ai-summary-box">🤖 ' + cleaned + '</div>';
            } else {
                el.innerHTML = '<div style="font-size:13px;color:var(--text-sub);text-align:center;padding:12px;">공고 원문 정보가 부족하여 요약을 생성할 수 없습니다.</div>';
            }
        } catch(e) { if (el) el.innerHTML = ''; }
    }

    // ── 유사 공고 ──
    async function loadSimilarJobs(jobId) {
        if (!jobId) return;
        try {
            var res = await fetch('/api/jobs/' + jobId + '/similar');
            if (!res.ok) return;
            var similar = await res.json();
            if (!similar || !similar.length) return;
            var sec = document.createElement('div');
            sec.className = 'section-card';
            sec.innerHTML = '<div class="section-title">🔗 이런 공고도 있어요</div>' +
                similar.map(function(j) {
                    var stacks = (j.techStack||'').split(',').map(function(s){return s.trim();}).filter(Boolean).slice(0,3);
                    var salaryDisplay = formatSalary(j);
                    return '<div class="similar-card" data-similar-id="'+j.id+'">' +
                        '<div class="sim-info"><div class="sim-company">'+(j.company||'')+'</div><div class="sim-title">'+(j.title||'')+'</div>' +
                        '<div class="sim-meta"><span>📍 '+(j.location||'미정')+'</span><span>💰 '+salaryDisplay+'</span>'+(stacks.length?'<span>🔧 '+stacks.join(', ')+'</span>':'')+'</div></div>' +
                        '<div class="sim-arrow">→</div></div>';
                }).join('');
            sec.addEventListener('click', function(e) {
                var card = e.target.closest('[data-similar-id]');
                if (!card) return;
                var id = card.getAttribute('data-similar-id');
                var matched = similar.find(function(j){ return String(j.id) === id; });
                if (matched) goSimilar(matched);
            });
            document.getElementById('mainContent').appendChild(sec);
        } catch(e) {}
    }

    function goSimilar(job) {
        sessionStorage.setItem('selectedJob', JSON.stringify({ job: { id: job.id, title: job.title, company: job.company }, score: 0, matchReason: '' }));
        location.href = '/job-detail';
    }

    // ── 배치 데이터 ──
    async function loadBatchData(jobId) {
        if (!jobId) return;
        try {
            var res = await fetch('/api/jobs/' + jobId + '/batch-info');
            if (!res.ok) return;
            var data = await res.json();
            renderCultureSection(data.cultureKeywords);
            renderCoreValuesSection(data.coreValues);
            renderNpsTrendSection(data.monthlyNpsData, data.estimatedAvgSalary);
        } catch(e) {}
    }

    // ── 프로필 주소 자동 로드 ──
    async function loadProfileLocation() {
        try {
            var meRes = await fetch('/api/members/me');
            if (!meRes.ok) return;
            var me = await meRes.json();
            if (!me.id) return;
            var profileRes = await fetch('/api/members/' + me.id + '/profile');
            if (!profileRes.ok) return;
            var profile = await profileRes.json();
            var addr = profile.preferredAddress;
            if (!addr || !addr.trim()) return;
            var input = document.getElementById('myLocInput');
            if (!input || input.value.trim()) return;
            input.value = addr;
            document.getElementById('myLocLabel').textContent = '📍 프로필 주소로 자동 설정됨';
            searchMyLocation();
        } catch(e) {}
    }

    function renderCultureSection(raw) {
        if (!raw || !raw.trim()) return;
        var keywords = raw.split(',').map(s => s.trim()).filter(Boolean);
        if (!keywords.length) return;
        var tagsHtml = keywords.map(function(k) { return '<span class="culture-tag">' + k + '</span>'; }).join('');
        var sec = document.createElement('div');
        sec.className = 'section-card'; sec.id = 'cultureSec';
        sec.innerHTML = '<div class="section-title">🌿 기업 문화</div><div style="display:flex;flex-wrap:wrap;gap:8px;">' + tagsHtml + '</div>' +
            '<div style="margin-top:12px;padding:10px 14px;background:#f0fdf4;border-radius:10px;border-left:3px solid #86efac;font-size:12px;color:#15803d;">💬 배치 프로젝트가 수집한 기업 문화 키워드입니다. 면접 전 참고해보세요!</div>';
        insertBeforeSection('npsSection', sec);
    }

    function renderCoreValuesSection(raw) {
        if (!raw || !raw.trim()) return;
        var values = raw.split(/[,\n]/).map(s => s.trim()).filter(Boolean);
        if (!values.length) return;
        var valueIcons = ['💎','🎯','🤝','🌟','🚀','⚡','🔑','🏆','💡','🌱'];
        var cardsHtml = values.map(function(v, i) {
            return '<div class="value-card"><div class="value-icon">' + valueIcons[i % valueIcons.length] + '</div><div class="value-label">' + v + '</div></div>';
        }).join('');
        var sec = document.createElement('div');
        sec.className = 'section-card'; sec.id = 'coreValuesSec';
        sec.innerHTML = '<div class="section-title">💎 기업 핵심가치</div><div class="value-grid">' + cardsHtml + '</div>' +
            '<div style="margin-top:12px;padding:10px 14px;background:#eef4ff;border-radius:10px;border-left:3px solid #c7d9f8;font-size:12px;color:#1e3a5f;">✨ 이 기업의 핵심가치를 면접 답변에 자연스럽게 녹여보세요.</div>';
        insertBeforeSection('npsSection', sec);
    }

    function renderNpsTrendSection(monthlyRaw, estimatedSalary) {
        var hasNps = monthlyRaw && monthlyRaw.trim();
        var hasSalary = estimatedSalary != null && estimatedSalary > 0;
        if (!hasNps && !hasSalary) return;
        var sec = document.createElement('div');
        sec.className = 'section-card'; sec.id = 'npsTrendSec';
        var html = '<div class="section-title">📈 국민연금 기반 고용 트렌드</div>';
        if (hasSalary) {
            html += '<div style="margin-bottom:16px;"><div style="font-size:12px;font-weight:700;color:var(--text-sub);margin-bottom:8px;">💰 예상 평균 연봉 (배치 수집)</div>' +
                '<div style="display:flex;align-items:center;gap:12px;"><div style="font-size:28px;font-weight:900;color:var(--navy);">' + estimatedSalary.toLocaleString() + '만원</div>' +
                '<div style="font-size:11px;color:var(--text-sub);line-height:1.6;">배치 프로젝트가<br>수집한 추정값</div></div></div>';
        }
        if (hasNps) {
            var parsed = normalizeNpsChartData(parseMonthlyNps(monthlyRaw));
            if (parsed && parsed.values.length >= 2) {
                var latest = parsed.values[parsed.values.length - 1] || 0;
                var prev = parsed.values[parsed.values.length - 2] || latest;
                var diff = latest - prev;
                var trendIcon = diff > 0 ? '📈' : diff < 0 ? '📉' : '➡️';
                var avg = Math.round(parsed.values.reduce((a,b) => a+b, 0) / parsed.values.length);
                var maxV = Math.max(...parsed.values);
                var latestLabel = parsed.labels[parsed.labels.length - 1] || '-';
                html += '<div style="font-size:12px;font-weight:700;color:var(--text-sub);margin-bottom:8px;">📊 월별 국민연금 가입자 수 추이</div>' +
                    '<div style="font-size:11px;color:#64748b;margin-bottom:10px;">📅 최신 수집 기준: ' + latestLabel + '</div>' +
                    '<div class="nps-trend-summary">' +
                    '<div class="nps-trend-stat"><div class="t-label">최근 월</div><div class="t-value">' + latest.toLocaleString() + '</div><div class="t-sub">명</div></div>' +
                    '<div class="nps-trend-stat"><div class="t-label">전월 대비</div><div class="t-value">' + trendIcon + ' ' + (diff > 0 ? '+' : '') + diff + '</div><div class="t-sub">' + (diff > 0 ? '증가' : diff < 0 ? '감소' : '변동 없음') + '</div></div>' +
                    '<div class="nps-trend-stat"><div class="t-label">평균</div><div class="t-value">' + avg.toLocaleString() + '</div><div class="t-sub">명</div></div>' +
                    '<div class="nps-trend-stat"><div class="t-label">최고</div><div class="t-value">' + maxV.toLocaleString() + '</div><div class="t-sub">명</div></div></div>' +
                    '<div class="nps-trend-wrap"><canvas id="npsTrendChart"></canvas></div>' +
                    '<div style="margin-top:10px;padding:10px 14px;background:#f0f9ff;border-radius:10px;border-left:3px solid #38bdf8;font-size:11px;color:#0369a1;line-height:1.7;">📌 국민연금 가입자 수 추이로 기업 규모 변화를 확인할 수 있습니다.</div>';
                window._pendingNpsChart = parsed;
            } else {
                html += '<div style="margin-top:14px;padding:16px;border:1px dashed #cbd5e1;border-radius:14px;background:#f8fafc;color:#64748b;font-size:13px;line-height:1.7;">📭 월별 데이터가 충분하지 않아 그래프를 표시할 수 없습니다.</div>';
                window._pendingNpsChart = null;
            }
        }
        sec.innerHTML = html;
        insertBeforeSection('npsSection', sec);
        if (window._pendingNpsChart) {
            setTimeout(function() {
                var canvas = document.getElementById('npsTrendChart');
                if (!canvas) return;
                var p = window._pendingNpsChart;
                if (_npsChartInstance) _npsChartInstance.destroy();
                _npsChartInstance = new Chart(canvas, {
                    type: 'line',
                    data: { labels: p.labels, datasets: [{ label: '국민연금 가입자 수', data: p.values, borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.08)', borderWidth: 2.5, pointBackgroundColor: '#3b82f6', pointRadius: 4, fill: true, tension: 0.35 }] },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: function(ctx) { return ' ' + ctx.parsed.y.toLocaleString() + '명'; } } } }, scales: { x: { grid: { display: false }, ticks: { font: { size: 11 }, color: '#6b7f96' } }, y: { grid: { color: '#f0f4f8' }, ticks: { font: { size: 11 }, color: '#6b7f96', callback: function(v) { return v.toLocaleString(); } } } } }
                });
                window._pendingNpsChart = null;
            }, 200);
        }
    }

    function parseMonthlyNps(raw) {
        if (!raw) return null;
        try {
            var parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
                var sorted = parsed.sort((a, b) => String(a.month).localeCompare(String(b.month)));
                return { labels: sorted.map(function(e) { var m = String(e.month); return '20' + m.substring(0,2) + '년 ' + m.substring(3) + '월'; }), values: sorted.map(function(e) { return Number(e.total); }) };
            }
            var entries = Object.entries(parsed).sort((a,b) => a[0].localeCompare(b[0]));
            return { labels: entries.map(function(e) { var k = String(e[0]); return k.length === 6 ? k.substring(0,4)+'년 '+k.substring(4)+'월' : k; }), values: entries.map(function(e) { return Number(e[1]); }) };
        } catch(e1) {
            try {
                var pairs = raw.split(',').map(s => s.trim()).filter(Boolean);
                var labels = [], values = [];
                pairs.forEach(function(p) { var kv = p.split(':'); if (kv.length === 2) { var k = kv[0].trim(); labels.push(k.length === 6 ? k.substring(0,4)+'년 '+k.substring(4)+'월' : k); values.push(Number(kv[1].trim())); } });
                if (labels.length) return { labels, values };
            } catch(e2) {}
        }
        return null;
    }

    function normalizeNpsChartData(parsed) {
        if (!parsed || !Array.isArray(parsed.labels) || !Array.isArray(parsed.values)) return null;
        var labels = [], values = [];
        for (var i = 0; i < parsed.values.length; i++) {
            var v = Number(parsed.values[i]);
            if (!isNaN(v) && parsed.labels[i]) { labels.push(parsed.labels[i]); values.push(v); }
        }
        if (!values.length) return null;
        return { labels: labels, values: values };
    }

    function insertBeforeSection(targetId, el) {
        var target = document.getElementById(targetId);
        if (target && target.parentNode) { target.parentNode.insertBefore(el, target); }
        else { document.getElementById('mainContent').appendChild(el); }
    }

    // ── GPS 관련 함수들 (전역) ──
    async function getMyGPS() {
        document.getElementById('myLocLabel').textContent = '📡 위치 감지 중...';
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(pos) {
                var latlng = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
                var geocoder = new kakao.maps.services.Geocoder();
                geocoder.coord2Address(pos.coords.longitude, pos.coords.latitude, function(result, status) {
                    var addr = (status === kakao.maps.services.Status.OK) ? result[0].address.address_name : 'GPS 위치';
                    document.getElementById('myLocInput').value = addr;
                    document.getElementById('myLocLabel').textContent = '✅ 현재 위치: ' + addr;
                });
                addMyMarker(latlng);
                calcRoute();
            }, function() {
                document.getElementById('myLocLabel').textContent = '❌ GPS 거부됨. IP 기반으로 시도합니다.';
                getMyGPSFallback();
            });
            return;
        }
        getMyGPSFallback();
    }

    async function getMyGPSFallback() {
        try {
            var res = await fetch('/api/location/ip');
            var data = await res.json();
            if (data.lat && data.lon) {
                var latlng = new kakao.maps.LatLng(data.lat, data.lon);
                var addr = (data.city || '') + ' ' + (data.regionName || '');
                document.getElementById('myLocInput').value = addr.trim();
                document.getElementById('myLocLabel').textContent = '📍 IP 기반 추정 위치: ' + addr.trim() + ' (정확도 낮음)';
                addMyMarker(latlng);
                calcRoute();
            }
        } catch(e) {
            document.getElementById('myLocLabel').textContent = '위치를 가져올 수 없습니다.';
        }
    }

    function searchMyLocation() {
        var input = document.getElementById('myLocInput').value.trim();
        if (!input) { alert('출발지 주소를 입력해주세요.'); return; }
        document.getElementById('myLocLabel').textContent = '주소 검색 중...';
        var geocoder = new kakao.maps.services.Geocoder();
        var ps = new kakao.maps.services.Places();
        geocoder.addressSearch(input, function(result, status) {
            if (status === kakao.maps.services.Status.OK) {
                myLatLng = new kakao.maps.LatLng(result[0].y, result[0].x);
                document.getElementById('myLocLabel').textContent = '✅ 출발지: ' + result[0].address.address_name;
                addMyMarker(myLatLng); calcRoute();
            } else {
                ps.keywordSearch(input, function(data, status2) {
                    if (status2 === kakao.maps.services.Status.OK) {
                        myLatLng = new kakao.maps.LatLng(data[0].y, data[0].x);
                        document.getElementById('myLocLabel').textContent = '✅ 출발지: ' + data[0].place_name;
                        addMyMarker(myLatLng); calcRoute();
                    } else {
                        document.getElementById('myLocLabel').textContent = '❌ 주소를 찾을 수 없습니다.';
                    }
                });
            }
        });
    }

    function addMyMarker(latlng) {
        myLatLng = latlng;
        if (window._myMarker) window._myMarker.setMap(null);
        window._myMarker = new kakao.maps.Marker({map: kakaoMap, position: latlng, title: '내 위치'});
        if (companyLatLng) {
            var bounds = new kakao.maps.LatLngBounds();
            bounds.extend(latlng); bounds.extend(companyLatLng);
            kakaoMap.setBounds(bounds);
        }
    }

    function selectRouteMode(mode) {
        currentRouteMode = mode;
        ['transit', 'car', 'walk'].forEach(function(m) { document.getElementById('tab-' + m).classList.toggle('active', m === mode); });
        if (myLatLng && companyLatLng) calcRoute();
    }

    function calcRoute() {
        if (!myLatLng || !companyLatLng) return;
        var distKm = getDistanceKm(myLatLng.getLat(), myLatLng.getLng(), companyLatLng.getLat(), companyLatLng.getLng());
        if (distKm > 500) {
            document.getElementById('routeResult').innerHTML = '<div class="route-detail">⚠️ 회사 위치를 정확히 찾지 못했습니다.</div>';
            return;
        }
        var time, detail, icon;
        if (currentRouteMode === 'transit') { time = formatTime(Math.round((distKm / 25) * 60)); detail = '직선거리 ' + distKm.toFixed(1) + 'km 기준 (대중교통 추정)'; icon = '🚌'; }
        else if (currentRouteMode === 'car') { time = formatTime(Math.round((distKm / 40) * 60)); detail = '직선거리 ' + distKm.toFixed(1) + 'km 기준 (자동차 추정)'; icon = '🚗'; }
        else { time = formatTime(Math.round((distKm / 4) * 60)); detail = '직선거리 ' + distKm.toFixed(1) + 'km 기준 (도보 추정)'; icon = '🚶'; }
        var kakaoLink = 'https://map.kakao.com/link/to/' + encodeURIComponent(window._mapCompany || '회사') + ',' + companyLatLng.getLat() + ',' + companyLatLng.getLng();
        document.getElementById('routeResult').innerHTML =
            '<div style="font-size:24px;margin-bottom:6px;">' + icon + '</div>' +
            '<div class="route-time">' + time + '</div>' +
            '<div class="route-detail">' + detail + '</div>' +
            '<div style="font-size:11px;color:var(--text-sub);margin-top:8px;">※ 실제 경로 기반 정확한 시간은 카카오맵에서 확인하세요</div>' +
            '<a href="' + kakaoLink + '" target="_blank" style="display:inline-block;margin-top:12px;padding:10px 20px;background:#FEE500;color:#3C1E1E;border-radius:10px;font-size:13px;font-weight:700;text-decoration:none;">🗺 카카오맵에서 세부 경로 보기</a>';
    }

    function getDistanceKm(lat1, lng1, lat2, lng2) {
        var R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLng = (lng2 - lng1) * Math.PI / 180;
        var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function formatTime(mins) {
        if (mins < 60) return mins + '분';
        var h = Math.floor(mins / 60), m = mins % 60;
        return m > 0 ? h + '시간 ' + m + '분' : h + '시간';
    }

    // ── NPS/DART 기업 정보 ──
    async function loadNpsData(companyName) {
        var name = (companyName || '').trim();
        try {
            var res = await fetch('/api/company/' + encodeURIComponent(name));
            var loading = document.getElementById('npsLoading');
            var content = document.getElementById('npsContent');
            if (!res.ok) { loading.textContent = '기업 정보를 찾을 수 없습니다.'; return; }
            var data = await res.json();
            loading.style.display = 'none';
            content.style.display = 'block';

            var npsStatus = data.wkplJngStcd;
            var hasAnyNpsInfo = (data.bzowrRgstNo && String(data.bzowrRgstNo).trim()) || (data.wkplNm && String(data.wkplNm).trim()) || (data.roadNmDtlAddr && String(data.roadNmDtlAddr).trim()) || (data.ldongAddrMgplDgCd && String(data.ldongAddrMgplDgCd).trim()) || (data.dataCrtYm && String(data.dataCrtYm).trim());
            var npsStatusBadge = npsStatus === '1' ? '<span class="nps-badge active">✅ 국민연금 가입 중</span>' : npsStatus === '2' ? '<span class="nps-badge inactive">❌ 국민연금 가입 종료</span>' : hasAnyNpsInfo ? '<span class="nps-badge active">📋 국민연금 정보 확인됨</span>' : '<span class="nps-badge unknown">❓ 국민연금 정보 미확인</span>';
            var typeMap = {'1':'법인','2':'개인','3':'국가/지방자치단체','4':'기타'};
            var typeLabel = typeMap[data.wkplStylDvcd] || data.wkplStylDvcd || '알 수 없음';
            var regionMap = {'11':'서울','21':'부산','22':'대구','23':'인천','24':'광주','25':'대전','26':'울산','29':'세종','31':'경기','32':'강원','33':'충북','34':'충남','35':'전북','36':'전남','37':'경북','38':'경남','39':'제주','41':'경기','42':'강원','43':'충북','44':'충남','45':'전북','46':'전남','47':'경북','48':'경남'};
            var regionLabel = regionMap[data.ldongAddrMgplDgCd] || (data.wkplRoadNmDtlAddr ? data.wkplRoadNmDtlAddr.split(' ')[0] : '알 수 없음');
            var corpClassMap = {'Y':'유가증권(코스피)','K':'코스닥','N':'비상장','E':'코넥스'};
            var listedLabel = data.corpClass ? (corpClassMap[data.corpClass] || data.corpClass) : '알 수 없음';
            var isListed = data.corpClass === 'Y' || data.corpClass === 'K' || data.corpClass === 'E';
            var fmt = function(v) { return v != null ? Math.round(v/100000000).toLocaleString()+'억원' : '-'; };
            var fmtN = function(v) { return v != null ? v.toLocaleString()+'명' : '-'; };
            var fmtD = function(d) { if (!d || d.length < 8) return d || '-'; return d.substring(0,4)+'년 '+d.substring(4,6)+'월 '+d.substring(6,8)+'일'; };

            var stabilityHtml = '';
            if (data.leaveRate != null) {
                var lr = Number(data.leaveRate);
                var lrColor = lr >= 20 ? 'warn' : '';
                var lrIcon = lr < 10 ? '🟢' : lr < 20 ? '🟡' : '🔴';
                var isDartEstimate = (lr === 5.0 || lr === 15.0 || lr === 25.0) && data.revenue != null;
                var leaveLabel = isDartEstimate ? '기업 안정성 (추정)' : '퇴사율';
                var leaveNote = isDartEstimate ? '※ NPS 직접 데이터 미제공 기업 — DART 영업이익률 기반 추정값입니다.' : '※ 국민연금 데이터 기반 실측값입니다.';
                stabilityHtml = '<div style="margin:14px 0 8px;font-size:12px;font-weight:700;color:var(--navy);">📉 기업 안정성</div>' +
                    '<div class="stat-grid"><div class="stat-box '+lrColor+'"><div class="stat-label">'+lrIcon+' '+leaveLabel+'</div><div class="stat-value">'+lr.toFixed(1)+'%</div></div>' +
                    (data.operatingProfit != null ? '<div class="stat-box '+(data.operatingProfit<0?'warn':'')+'"><div class="stat-label">'+(data.operatingProfit<0?'🔴':'🟢')+' 영업이익</div><div class="stat-value" style="font-size:16px">'+fmt(data.operatingProfit)+'</div></div>' : '') + '</div>' +
                    (lr >= 20 ? '<div class="warning-box">⚠️ '+leaveLabel+'이 높은 편입니다. 입사 전 기업 안정성을 꼭 확인해보세요.</div>' : '') +
                    '<div class="info-box">'+leaveNote+'</div>';
            }

            content.innerHTML = npsStatusBadge +
                (data.corpClass ? '<span class="nps-badge '+(isListed?'active':'inactive')+'" style="margin-left:6px">'+(isListed?'📈 '+listedLabel+' 상장':'🔒 비상장')+'</span>' : '') +
                '<div style="margin:14px 0 8px;font-size:12px;font-weight:700;color:var(--navy);">📋 국민연금 정보</div>' +
                '<div class="nps-grid">' +
                '<div class="nps-box"><div class="nps-label">사업장명</div><div class="nps-value">'+(data.companyName||'-')+'</div></div>' +
                '<div class="nps-box"><div class="nps-label">사업자등록번호</div><div class="nps-value">'+(data.bzowrRgstsNo||(data.dartCorpCode?'DART 미등록 기업':'NPS/DART 데이터 없음'))+'</div></div>' +
                '<div class="nps-box"><div class="nps-label">사업장 유형</div><div class="nps-value">'+typeLabel+'</div></div>' +
                '<div class="nps-box"><div class="nps-label">지역</div><div class="nps-value">'+regionLabel+'</div></div>' +
                '<div class="nps-box"><div class="nps-label">주소</div><div class="nps-value">'+(data.wkplRoadNmDtlAddr||regionLabel||'-')+'</div></div>' +
                '<div class="nps-box"><div class="nps-label">데이터 기준월</div><div class="nps-value">'+(data.dataCrtYm?data.dataCrtYm.substring(0,4)+'년 '+data.dataCrtYm.substring(4)+'월':'-')+'</div></div></div>' +
                '<div style="margin:14px 0 8px;font-size:12px;font-weight:700;color:var(--navy);">🏛 DART 기업 정보</div>' +
                (data.dartCorpCode ?
                    '<div class="nps-grid">' +
                    '<div class="nps-box"><div class="nps-label">대표자명</div><div class="nps-value">'+(data.ceoName||'-')+'</div></div>' +
                    '<div class="nps-box"><div class="nps-label">설립일</div><div class="nps-value">'+fmtD(data.establishDate)+'</div></div>' +
                    '<div class="nps-box"><div class="nps-label">상장구분</div><div class="nps-value">'+listedLabel+'</div></div>' +
                    '<div class="nps-box"><div class="nps-label">결산월</div><div class="nps-value">'+(data.closingMonth?data.closingMonth+'월':'-')+'</div></div>' +
                    '<div class="nps-box"><div class="nps-label">홈페이지</div><div class="nps-value">'+(data.homepageUrl?'<a href="'+data.homepageUrl+'" target="_blank" style="color:var(--navy)">'+data.homepageUrl+'</a>':'-')+'</div></div>' +
                    '<div class="nps-box"><div class="nps-label">사원수</div><div class="nps-value">'+fmtN(data.employeeCount)+'</div></div></div>' +
                    '<div style="margin:14px 0 8px;font-size:12px;font-weight:700;color:var(--navy);">💰 재무 정보</div>' +
                    '<div class="nps-grid">' +
                    '<div class="nps-box"><div class="nps-label">매출액</div><div class="nps-value">'+(data.revenue!=null?Math.round(data.revenue/100000000).toLocaleString()+'억원':'비상장/미공시')+'</div></div>' +
                    '<div class="nps-box"><div class="nps-label">영업이익</div><div class="nps-value">'+(data.operatingProfit!=null?Math.round(data.operatingProfit/100000000).toLocaleString()+'억원':'비상장/미공시')+'</div></div>' +
                    '<div class="nps-box"><div class="nps-label">당기순이익</div><div class="nps-value">'+(data.netIncome!=null?Math.round(data.netIncome/100000000).toLocaleString()+'억원':'비상장/미공시')+'</div></div>' +
                    '<div class="nps-box"><div class="nps-label">배당정보</div><div class="nps-value">'+(data.dividendInfo||'미공시')+'</div></div></div>'
                    :
                    '<div style="padding:16px;background:#f8f9fa;border-radius:10px;border:1.5px dashed #d6e0ec;text-align:center;margin-bottom:12px;">' +
                    '<div style="font-size:24px;margin-bottom:6px;">📋</div>' +
                    '<div style="font-size:13px;font-weight:700;color:var(--text-sub);margin-bottom:4px;">공시 정보 없음</div>' +
                    '<div style="font-size:12px;color:var(--text-sub);">비상장·소규모 기업으로 DART 공시 의무가 없어 재무·기업 정보를 확인할 수 없습니다.</div>' +
                    '<div style="margin-top:8px;padding:6px 12px;background:#fee2e2;border-radius:8px;font-size:11px;font-weight:700;color:#dc2626;display:inline-block;">⚠️ 기업정보 미확인으로 매칭 점수가 감점됩니다</div></div>'
                ) + stabilityHtml;
        } catch(e) {
            document.getElementById('npsLoading').textContent = '기업 정보 조회 중 오류가 발생했습니다.';
        }
    }

    function toggleDesc() {
        var box = document.getElementById('fullDescBox');
        var btn = document.querySelector('.btn-toggle');
        if (!box) return;
        if (box.style.maxHeight === 'none') { box.style.maxHeight = '300px'; btn.textContent = '▼ 더보기'; }
        else { box.style.maxHeight = 'none'; btn.textContent = '▲ 접기'; }
    }

    // ── 지도 ──
    function initMap(companyName, location) {
        var container = document.getElementById('map');
        if (!container) return;
        kakaoMap = new kakao.maps.Map(container, { center: new kakao.maps.LatLng(37.5665,126.9780), level:5 });
        var geocoder = new kakao.maps.services.Geocoder();
        var ps = new kakao.maps.services.Places();
        var cleanLocation = (location || '').replace(/\s*(외|및|등).*$/, '').trim();
        var searchAddr = (cleanLocation && cleanLocation.length > 3) ? cleanLocation : companyName;
        function trySearch(query, fallback) {
            geocoder.addressSearch(query, function(result, status) {
                if (status === kakao.maps.services.Status.OK) {
                    setCompanyMarker(new kakao.maps.LatLng(result[0].y, result[0].x), result[0].address_name || query);
                } else {
                    ps.keywordSearch(query, function(data, status2) {
                        if (status2 === kakao.maps.services.Status.OK) { setCompanyMarker(new kakao.maps.LatLng(data[0].y, data[0].x), data[0].address_name); }
                        else if (fallback) { trySearch(fallback, null); }
                        else { document.getElementById('mapAddrLabel').textContent = '위치 정보를 찾을 수 없습니다.'; }
                    });
                }
            });
        }
        trySearch(searchAddr, searchAddr !== companyName ? companyName : null);
    }

    function setCompanyMarker(coords, addr) {
        if (window._companyMarker) window._companyMarker.setMap(null);
        if (window._companyIw) window._companyIw.close();
        companyLatLng = coords;
        kakaoMap.setCenter(coords);
        window._companyMarker = new kakao.maps.Marker({ map: kakaoMap, position: coords, title:'회사 위치' });
        window._companyIw = new kakao.maps.InfoWindow({ content:'<div style="padding:8px 12px;font-size:13px;font-weight:700;color:#1e3a5f;">🏢 회사 위치</div>' });
        window._companyIw.open(kakaoMap, window._companyMarker);
        document.getElementById('mapAddrLabel').innerHTML = '📍 <strong>' + (addr || '주소 정보 없음') + '</strong>';
    }

    // ── DOMContentLoaded ──
    window.addEventListener('DOMContentLoaded', async function() {
        var raw = sessionStorage.getItem('selectedJob');
        if (!raw) {
            var urlId = new URLSearchParams(location.search).get('id');
            if (urlId) {
                var res = await fetch('/api/jobs/' + urlId);
                if (res.ok) { var jobData = await res.json(); raw = JSON.stringify({ job: jobData, score: jobData.score || 0, matchReason: '' }); }
            }
            if (!raw) { document.getElementById('not-found').style.display='block'; return; }
        }

        var item = JSON.parse(raw);
        var job = item.job || item || {};
        _currentJob = job;
        var score = item.score || 0;
        var level = score >= 70 ? 'high' : score >= 40 ? 'mid' : 'low';
        var levelLabel = score >= 70 ? '높은 매칭' : score >= 40 ? '중간 매칭' : '낮은 매칭';
        var stacks = (job.techStack||'').split(',').map(s=>s.trim()).filter(Boolean);
        var stackHtml = stacks.length ? stacks.map(s=>'<span class="tag">'+s+'</span>').join('') : '<span class="tag gray">정보 없음</span>';
        var reasons = parseMatchReasons(item.matchReason || '');
        var legendHtml = reasons.map(function(r) {
            var barW = r.rawScore > 0 ? r.rawScore : 0;
            var scoreLabel = r.weight > 0 ? r.rawScore+'점 × '+r.weight+'% = <strong>'+r.val+'점</strong>' : '-';
            var statusIcon = r.rawScore >= 80 ? '🟢' : r.rawScore >= 40 ? '🟡' : '🔴';
            return '<div class="legend-item"><div class="legend-dot" style="background:'+r.color+'"></div>' +
                '<div class="legend-info"><div class="legend-name">'+statusIcon+' '+r.name+' <span style="font-size:10px;color:var(--text-sub);font-weight:400;">(가중치 '+r.weight+'%)</span></div>' +
                '<div class="legend-bar"><div class="legend-bar-fill" style="width:0%;background:'+r.color+'" data-w="'+barW+'"></div></div>' +
                '<div style="font-size:11px;color:var(--text-sub);margin-top:3px;">'+scoreLabel+'</div></div>' +
                '<div class="legend-val" style="font-size:14px;font-weight:800;">'+r.val+'</div></div>';
        }).join('');
        var fullDesc = job.fullDescription || '';
        var descHtml = fullDesc ? '<div class="section-card"><div class="section-title">📄 공고 원문</div><div class="full-desc" id="fullDescBox">'+fullDesc.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div><button class="btn-toggle" onclick="toggleDesc()">▼ 더보기</button></div>' : '';
        var salaryDisplay = formatSalary(job);

        document.getElementById('mainContent').innerHTML =
            '<div class="job-header">' +
                '<div class="job-header-top"><div><div class="job-company">'+(job.company||'알 수 없음')+'</div><div class="job-title">'+(job.title||'제목 없음')+'</div></div>' +
                '<div class="score-badge '+level+'"><span class="dot"></span>'+score+'점 · '+levelLabel+'</div></div>' +
                '<div class="job-meta"><div class="meta-item">📍 <strong>'+(job.location||'미정')+'</strong></div><div class="meta-item">💼 <strong>'+(job.jobType||'무관')+'</strong></div><div class="meta-item">💰 <strong>'+salaryDisplay+'</strong></div></div>' +
            '</div>' +
            '<div class="section-card"><div class="section-title">📊 매칭 분석</div>' +
                '<div class="match-chart-wrap"><div class="donut-wrap"><canvas id="donutCanvas"></canvas><div class="donut-center"><div class="donut-score">'+score+'</div><div class="donut-label">/ 100점</div></div></div>' +
                '<div class="chart-legend">'+legendHtml+'</div></div>' +
                (stacks.length ? '<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border)"><div style="font-size:12px;font-weight:700;color:var(--text-sub);margin-bottom:8px;">🔧 공고 기술스택</div><div class="tags">'+stackHtml+'</div></div>' : '') +
            '</div>' +
            '<div class="section-card"><div class="section-title">🤖 AI 공고 요약</div><div id="aiSummaryContent"><div class="ai-summary-loading">✨ AI가 공고를 요약하고 있습니다...</div></div></div>' +
            '<div class="section-card" id="npsSection"><div class="section-title">🏢 국민연금 + DART 기업 정보</div><div class="nps-loading" id="npsLoading">🔍 기업 정보 조회 중...</div><div id="npsContent" style="display:none"></div></div>' +
            '<div class="section-card" id="mapSection"><div class="section-title">🗺 회사 위치 및 경로</div>' +
                '<div class="map-addr-label" id="mapAddrLabel">📍 주소를 조회 중입니다...</div><div id="map"></div>' +
                '<div style="margin-top:16px;"><div style="font-size:13px;font-weight:700;color:var(--navy);margin-bottom:8px;">📍 내 출발지 설정</div>' +
                '<div class="location-input-wrap"><input type="text" id="myLocInput" placeholder="주소 입력 또는 GPS 사용"/>' +
                '<button class="btn-gps" onclick="getMyGPS()">📡 GPS</button><button class="btn-locate" onclick="searchMyLocation()">검색</button></div>' +
                '<div id="myLocLabel" style="font-size:12px;color:var(--text-sub);margin-bottom:12px;"></div></div>' +
                '<div class="route-tabs"><button class="route-tab active" id="tab-transit" onclick="selectRouteMode(\'transit\')">🚌 대중교통</button>' +
                '<button class="route-tab" id="tab-car" onclick="selectRouteMode(\'car\')">🚗 자동차</button>' +
                '<button class="route-tab" id="tab-walk" onclick="selectRouteMode(\'walk\')">🚶 도보</button></div>' +
                '<div class="route-result" id="routeResult"><div class="route-detail">출발지를 설정하면 소요시간이 표시됩니다</div></div>' +
            '</div>' +
            descHtml +
            (job.url ? '<a class="btn-saramin" href="'+job.url+'" target="_blank">사람인에서 원문 공고 보기 →</a>' : '');

        setTimeout(function() {
            drawDonut('donutCanvas', score);
            document.querySelectorAll('.legend-bar-fill').forEach(function(el) { el.style.width = el.getAttribute('data-w') + '%'; });
        }, 150);

        var companyName = (job.company || '').trim();
        if (companyName) loadNpsData(companyName);
        if (companyName && job.id) {
            fetch('/api/jobs/' + job.id + '/update-company', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({companyName: companyName}) }).catch(()=>{});
        } else {
            document.getElementById('npsLoading').textContent = '회사 정보가 없습니다.';
        }

        if (job.id) {
            loadAiSummary(job.id);
            loadBatchData(job.id);
            loadProfileLocation();
            setTimeout(function() { loadSimilarJobs(job.id); }, 1000);
        }

        window._mapCompany = companyName;
        window._mapLocation = job.location;
        var script = document.createElement('script');
        script.type = 'text/javascript';
        script.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=2d23174337e0fa12ddc89d08426cc1b3&libraries=services&autoload=false';
        script.onload = function() { kakao.maps.load(function() { initMap(window._mapCompany, window._mapLocation); }); };
        document.head.appendChild(script);
    });
</script>
